[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "google-genai==2.17.0",
    "httpx==0.28.1",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-ai==2.27.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.52.1",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = ["integration: requires live Supabase/network"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI idiom is `Depends(...)` as a default arg — not the mutable-default
# footgun B008 otherwise guards against, since FastAPI resolves it per-request.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
]
